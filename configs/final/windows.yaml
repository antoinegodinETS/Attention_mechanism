# Phase 6 configuration for windows attention, chosen by the phase 5 search
# (`python scripts/hpsearch.py select`; do not edit by hand).
# Trial 3 of 8 (run cifar10-32-p4-windows-search.t3-s3): validation accuracy 0.7260 at epoch 30, best 0.7260 (epoch 30).
# Search: results/hpsearch_cifar10.csv. Rule: highest val accuracy at epoch 30; ties go to
# the higher best val accuracy, then the lower trial index.
# The chosen lr, weight decay, drop-path and warmup (in epochs) are kept; epochs become 100
# and the test split is evaluated once at the end. Phase 6 queue lines override seed and the
# dataset (data.name, data.res) for the CIFAR-10-HR conditions.
tag: final
seed: 0
device: auto
amp: true
eval_test: true
eval_batch_size: 256
data:
  name: cifar10
  res: 32
  train_split: train
  val_split: val
  test_split: test
  num_workers: 4
  synthetic_size: 256
  synthetic_classes: 10
model:
  mechanism: windows
  head: auto
  patch_size: 4
  dim: 192
  depth: 9
  num_heads: 3
  mlp_ratio: 2.0
  drop_path: 0.1
  attn_kernel: sdpa
  sdpa_backend: efficient
  attn: {}
augment:
  crop_padding: 0.125
  hflip: true
  randaugment_ops: 2
  randaugment_magnitude: 9
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  mix_prob: 1.0
  switch_prob: 0.5
  label_smoothing: 0.1
optim:
  epochs: 100
  batch_size: 128
  accum_steps: 1
  lr: 0.000901
  min_lr: 1.0e-05
  weight_decay: 0.0953
  warmup_epochs: 10.0
  beta1: 0.9
  beta2: 0.999
  grad_clip: null
